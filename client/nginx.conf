server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Фото й PDF бланків для AI-розпізнавання.
  client_max_body_size 20m;

  location /api/ {
    proxy_pass http://server:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # AI-розпізнавання може думати довше за дефолтні 60 с.
    proxy_read_timeout 180s;
  }

  # Оболонка й service worker мусять оновлюватись одразу після деплою.
  location = /index.html { add_header Cache-Control "no-cache"; }
  location = /sw.js { add_header Cache-Control "no-cache"; }

  # Хешовані ассети незмінні.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA: будь-який маршрут (/b/vitamin-d) віддає оболонку.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
