<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Bioma</title>
  <desc>Логотип для іконок PWA: непрозорий фон + логотип у безпечній зоні maskable.</desc>

  <!-- Непрозорий фон: maskable-іконку система обрізає під свою форму,
       тож прозорість тут дала б чорні кути на Android. -->
  <rect width="512" height="512" fill="#FBFBFC"/>

  <!-- Логотип стиснуто і відцентровано. 0.78 — не «на око»: вміст із
       урахуванням товщини штриха займає ~71% полотна, після масштабу це ~55%.
       Квадрат, вписаний у безпечне коло maskable (діаметр 80%), має сторону
       80%/√2 ≈ 56.6% — тобто ми рівно всередині, з мінімальним запасом і
       без зайвих полів на звичайній (не-maskable) іконці. -->
  <g transform="translate(256 256) scale(0.78) translate(-256 -256)">
    <g stroke="#0E7C86" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
      <path d="M256 54C256 54 122 210 122 327C122 407 182 458 256 458C330 458 390 407 390 327C390 210 256 54 256 54Z"/>
      <path d="M104 292H162"/>
      <path d="M350 292H408"/>
      <path d="M86 258V326"/>
      <path d="M110 244V340"/>
      <path d="M134 266V318"/>
      <path d="M378 266V318"/>
      <path d="M402 244V340"/>
      <path d="M426 258V326"/>
      <path d="M144 292H210L230 248L258 338L286 276L306 292H368"/>
    </g>
  </g>
</svg>
